<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #C0110A;
    --red-bright: #E01A10;
    --red-deep: #7A0804;
    --black: #050404;
    --surface: #0D0808;
    --surface2: #140A0A;
    --text: #F0E8E8;
    --text-muted: #8A6A6A;
    --border: rgba(192,17,10,0.25);
    --green: #3FBF6A;
    --gold: #D6A84A;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    min-height: 100vh;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 2.5rem;
    background: rgba(5,4,4,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 0.5px solid var(--border);
  }

  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.1em;
    color: var(--red-bright);
    text-decoration: none;
  }

  .nav-cta { display: flex; gap: 0.75rem; align-items: center; }

  .btn-outline {
    padding: 0.5rem 1.2rem;
    border: 1px solid var(--red);
    color: var(--red-bright);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .btn-outline:hover { background: var(--red); color: var(--text); }

  .btn-solid {
    padding: 0.5rem 1.4rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-solid:hover { background: var(--red-bright); }

  /* Mobile icon-only nav buttons — hidden on desktop, mirrors the homepage nav */
  .nav-icon-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(192,17,10,0.06);
    color: var(--text-muted);
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
    flex-shrink: 0;
  }
  .nav-icon-btn:hover { border-color: var(--red); color: var(--red-bright); background: rgba(192,17,10,0.14); }
  .nav-icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

  main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 8rem 1.5rem 4rem;

  .bg-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(120,8,4,0.35) 0%, transparent 70%);
    pointer-events: none;
    animation: glowBreathe 7s ease-in-out infinite;
    transform-origin: 50% 40%;
  }

  @keyframes glowBreathe {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-glow { animation: none; }
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 640px;
    width: 100%;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--red-bright);
    margin-bottom: 1rem;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(2rem, 5vw, 3rem);
    margin-bottom: 1.2rem;
  }

  .sub {
    color: var(--text-muted);
    font-size: 0.95rem;
    max-width: 460px;
    margin: 0 auto 2.5rem;
  }

  .card {
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 2rem;
    text-align: left;
  }

  label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
  }

  .input-row {
    display: flex;
    align-items: stretch;
    gap: 0.75rem;

  input[type="text"] {
    flex: 1;
    min-width: 0;

    line-height: 1.2;

    transition: border-color 0.2s;
  }
  input[type="text"]::placeholder { color: #5c4747; }
  input[type="text"]:focus { border-color: var(--red-bright); }

  .check-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #fff;
    padding: 0.9rem 1.6rem;
    line-height: 1.2;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .check-btn:hover:not(:disabled) { background: var(--red-bright); }
  .check-btn:disabled { opacity: 0.85; cursor: default; }

  /* Spinner shown inside the button while the check is running */
  .btn-spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
    display: none;
    flex-shrink: 0;
  }
  .check-btn.loading .btn-spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Eligibility result message — glass panel */
  .msg {
    margin-top: 1rem;
    font-size: 0.85rem;
    padding: 0.85rem 1rem;
    display: none;
    border: 1px solid transparent;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.35s ease, transform 0.35s ease;

    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 4px 24px rgba(0,0,0,0.35);
  }
  .msg.show {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }
  .msg.error {
    color: #FF6B6B;
    border-color: rgba(122,8,4,0.55);
    background: rgba(122,8,4,0.22);
  }
  .msg.success {
    color: #C9F5D8;
    border-color: rgba(63,191,106,0.45);
    background: rgba(63,191,106,0.14);
  }
  .msg.neutral {
    color: #C4B49A;
    border-color: rgba(180,160,130,0.4);
    background: rgba(180,160,130,0.15);
  }

  .phase-tag {
    display: inline-block;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.08em;
    font-size: 1.1rem;
    margin-bottom: 0.3rem;
  }

  .phase-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 0.4rem;
  }

  .msg-body {
    opacity: 1;
    transition: opacity 0.22s ease;
  }

  .check-sequence {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .check-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.08em;
    font-size: 0.95rem;
    color: var(--text-muted);
    opacity: 0;
    transform: translateX(-6px);
    animation: rowIn 0.3s ease forwards;
    transition: opacity 0.25s ease;
  }
  .check-row.is-match { color: #C9F5D8; }
  .check-row.is-no-match { color: #E0645C; opacity: 0.8; }

  @keyframes rowIn {
    to { opacity: 1; transform: translateX(0); }
  }

  .check-row-status {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
  }
  .check-row-status.pending::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: pendingPulse 0.9s ease-in-out infinite;
  }
  @keyframes pendingPulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.25); }
  }
  .check-row-status.match { color: #3FBF6A; }
  .check-row-status.match::before { content: '\2713'; }
  .check-row-status.no-match { color: #E0645C; }
  .check-row-status.no-match::before { content: '\2715'; }
  .check-row-status.match,
  .check-row-status.no-match {
    animation: statusPop 0.3s ease;
  }
  @keyframes statusPop {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .check-row { animation: none; opacity: 1; transform: none; }
    .check-row-status.pending::before { animation: none; }
    .check-row-status.match,
    .check-row-status.no-match { animation: none; }
    .msg-body { transition: none; }
  }

  .phase-chip {
    display: inline-block;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.08em;
    font-size: 0.9rem;
    padding: 0.2rem 0.7rem;
    border: 1px solid rgba(63,191,106,0.5);
    background: rgba(63,191,106,0.1);
    color: #C9F5D8;
    opacity: 0;
    transform: translateY(4px) scale(0.94);
    animation: chipPop 0.4s ease forwards;
  }

  @keyframes chipPop {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .phase-chip { animation: none; opacity: 1; transform: none; }
  }

  footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 1.5rem;
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  footer a { color: var(--red-bright); text-decoration: none; }

  @media (max-width: 520px) {
    .input-row { flex-direction: column; }
    .check-btn { width: 100%; }
    nav { padding: 1rem 1.2rem; }
  }

  /* Mirrors the homepage's mobile nav: icon-only Discord/X buttons, luxury minimal treatment */
  @media (max-width: 720px) {
    .nav-cta .btn-outline,
    .nav-cta .btn-solid { display: none; }
    .nav-icon-btn { display: flex; }
    .nav-cta { gap: 0.5rem; }
  }
</style>

<script>
(function () {
  const input = document.getElementById('wallet');
  const btn = document.getElementById('checkBtn');
  const btnLabel = btn.querySelector('.btn-label');
  const msg = document.getElementById('msg');
  const msgBody = document.getElementById('msgBody');

  // Base58, 32-44 chars — standard Solana address shape (excludes 0, O, I, l).
  const SOLANA_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;

  const FILES = {
    OG: 'og.csv',
    WL: 'wl.csv',
    WL2: 'wl2.csv'
  };

  let lists = null; // { OG: Set, WL: Set, WL2: Set }
  let loadError = false;

  // Minimum time the loading state stays visible, so a fast cache hit
  // still reads as a deliberate check rather than an instant flicker.
  const MIN_CHECK_MS = 550;

  function parseCsv(text) {
    return text
      .split(/\r?\n/)
      .map(line => line.split(',')[0].trim().replace(/^"|"$/g, ''))
      .filter(addr => addr && addr.toLowerCase() !== 'wallet' && addr.toLowerCase() !== 'address' && addr.toLowerCase() !== 'wallet address');
  }

  async function loadLists() {
    try {
      const entries = await Promise.all(
        Object.entries(FILES).map(async ([phase, file]) => {
          const res = await fetch(file, { cache: 'no-store' });
          if (!res.ok) throw new Error(file + ' failed to load');
          const text = await res.text();
          return [phase, new Set(parseCsv(text))];
        })
      );
      lists = Object.fromEntries(entries);
    } catch (e) {
      loadError = true;
    }
  }

  function hideMsg() {
    msg.classList.remove('show');
  }

  function showMsg(text, type) {
    msg.className = 'msg ' + type;
    msgBody.textContent = text;
    // reflow so the fade-in transition replays every time, even for the same type
    void msg.offsetWidth;
    msg.classList.add('show');
  }

  function showPhaseMsg(label, text, type) {
    msg.className = 'msg ' + type;
    msgBody.innerHTML = '<span class="phase-tag">' + label + '</span><br>' + text;
    void msg.offsetWidth;
    msg.classList.add('show');
  }

  function showMultiPhaseMsg(labels, text, type) {
    const chips = labels
      .map((l, i) => '<span class="phase-chip" style="animation-delay:' + (i * 90) + 'ms">' + l + '</span>')
      .join('');
    msg.className = 'msg ' + type;
    msgBody.innerHTML = '<div class="phase-tags">' + chips + '</div>' + text;
    void msg.offsetWidth;
    msg.classList.add('show');
  }

  // Swaps msgBody's content in place: fades the old content out, morphs the
  // panel to the new content's height, then fades the new content in. The
  // outer .msg panel (border/background) never disappears — only the
  // content inside it changes, so it reads as one continuous panel.
  function crossfadeMsgBody(renderFn) {
    const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
      renderFn();
      return;
    }

    const cs = getComputedStyle(msg);
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const startHeight = msg.getBoundingClientRect().height;

    msg.style.height = startHeight + 'px';
    msg.style.overflow = 'hidden';
    msg.style.transition = 'height 0.32s ease';
    msgBody.style.opacity = '0';

    setTimeout(() => {
      renderFn();
      void msgBody.offsetWidth;
      const targetHeight = msgBody.scrollHeight + padY;
      msg.style.height = targetHeight + 'px';
      msgBody.style.opacity = '1';

      setTimeout(() => {
        // Release the fixed height once settled so the panel stays fluid.
        msg.style.height = '';
        msg.style.overflow = '';
        msg.style.transition = '';
      }, 340);
    }, 220);
  }

  function revealFinalEligibility(matched) {
    crossfadeMsgBody(() => {
      setLoading(false);
      if (matched.length === 0) {
        msg.className = 'msg neutral show';
        msgBody.innerHTML = '<span class="phase-tag">PUBLIC PHASE</span><br>' +
          "This wallet isn't on an allowlist. You'll be able to mint during the Public phase.";
      } else if (matched.length === 1) {
        msg.className = 'msg success show';
        msgBody.innerHTML = '<span class="phase-tag">' + matched[0] + ' PHASE</span><br>' +
          "You're eligible to mint during the " + matched[0] + " phase.";
      } else {
        msg.className = 'msg success show';
        const nice = matched.join(', ').replace(/, ([^,]*)$/, ' & $1');
        const chips = matched
          .map((p, i) => '<span class="phase-chip" style="animation-delay:' + (i * 90) + 'ms">' + p + ' PHASE</span>')
          .join('');
        msgBody.innerHTML = '<div class="phase-tags">' + chips + '</div>' +
          "You're eligible to mint during the " + nice + " phases.";
      }
    });
  }

  function showEligibilityCheckSequence(matched) {
    const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
      revealFinalEligibility(matched);
      return;
    }

    const phases = ['OG', 'WL', 'WL2'];
    // Neutral shell while rows are still resolving — the final class
    // (success/neutral) is applied once revealFinalEligibility lands,
    // so a no-match result doesn't sit inside a green "success" panel
    // while it's still being decided.
    msg.className = 'msg neutral';
    msgBody.innerHTML = '<div class="check-sequence">' +
      phases.map((p, i) =>
        '<div class="check-row" data-phase="' + p + '" style="animation-delay:' + (i * 90) + 'ms">' +
          '<span>' + p + ' PHASE</span>' +
          '<span class="check-row-status pending"></span>' +
        '</div>'
      ).join('') +
      '</div>';
    void msg.offsetWidth;
    msg.classList.add('show');

    let i = 0;
    function resolveNext() {
      if (i >= phases.length) {
        setTimeout(() => revealFinalEligibility(matched), 450);
        return;
      }
      const phase = phases[i];
      const row = msgBody.querySelector('.check-row[data-phase="' + phase + '"]');
      if (row) {
        const statusEl = row.querySelector('.check-row-status');
        const isMatch = matched.includes(phase);
        statusEl.className = 'check-row-status ' + (isMatch ? 'match' : 'no-match');
        row.classList.add(isMatch ? 'is-match' : 'is-no-match');
      }
      i++;
      setTimeout(resolveNext, 420);
    }
    // Let the rows finish entering before the first one resolves.
    setTimeout(resolveNext, 400);
  }

  function isSolanaAddress(addr) {
    return SOLANA_RE.test(addr);
  }

  function setLoading(isLoading) {
    btn.disabled = isLoading;
    btn.classList.toggle('loading', isLoading);
    btnLabel.textContent = isLoading ? 'Checking...' : 'Check';
  }

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function handleCheck() {
    const addr = input.value.trim();

    if (!addr) {
      showMsg('Paste a wallet address to check.', 'error');
      return;
    }

    if (!isSolanaAddress(addr)) {
      showMsg("That doesn't look like a valid Solana wallet address. Double-check and try again.", 'error');
      return;
    }

    hideMsg();
    setLoading(true);
    const startedAt = Date.now();

    if (!lists && !loadError) {
      await loadLists();
    }

    // Keep the spinner up for at least MIN_CHECK_MS so the result
    // always lands as a distinct, readable moment.
    const elapsed = Date.now() - startedAt;
    if (elapsed < MIN_CHECK_MS) {
      await wait(MIN_CHECK_MS - elapsed);
    }

    if (loadError || !lists) {
      setLoading(false);
      showMsg('Could not load eligibility data. Please refresh or try again shortly.', 'error');
      return;
    }

    const matched = [];
    if (lists.OG.has(addr)) matched.push('OG');
    if (lists.WL.has(addr)) matched.push('WL');
    if (lists.WL2.has(addr)) matched.push('WL2');

    // Button stays in its loading state through the full row-by-row check
    // sequence regardless of outcome — showEligibilityCheckSequence turns
    // it off (via revealFinalEligibility) once the final result is on screen.
    showEligibilityCheckSequence(matched);
  }

  btn.addEventListener('click', handleCheck);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleCheck();
  });

  // Warm the lists in the background so the first check feels instant.
  loadLists();
})();
</script>

</body>
</html>
